<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Línea de tiempo del desarrollo de un gato</title>
  <desc id="d">Etapas desde el nacimiento hasta la vejez. La ventana de socialización, entre la segunda y la séptima semana, está resaltada.</desc>
  <rect x="0" y="0" width="900" height="380" fill="#FFF9F2"/>
  <rect x="225" y="60" width="210" height="240" rx="12" fill="#2F5D50" opacity="0.12"/>
  <text x="330" y="84" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="14" font-weight="700" fill="#2F5D50">Ventana de socialización</text>
  <text x="330" y="102" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#2F5D50">2 a 7 semanas</text>
  <line x1="60" y1="190" x2="840" y2="190" stroke="#c9b49a" stroke-width="4" stroke-linecap="round"/>
  <g font-family="DM Sans, sans-serif" text-anchor="middle">
    <g>
      <circle cx="60" cy="190" r="9" fill="#A84E1C"/>
      <text x="60" y="162" font-size="13" font-weight="700" fill="#2c2416">Nacimiento</text>
      <text x="60" y="226" font-size="12" fill="#6b5c44">Día 0</text>
    </g>
    <g>
      <circle cx="170" cy="190" r="9" fill="#A84E1C"/>
      <text x="170" y="162" font-size="13" font-weight="700" fill="#2c2416">Ojos abiertos</text>
      <text x="170" y="226" font-size="12" fill="#6b5c44">7 a 14 días</text>
    </g>
    <g>
      <circle cx="280" cy="190" r="9" fill="#A84E1C"/>
      <text x="280" y="162" font-size="13" font-weight="700" fill="#2c2416">Primeros pasos</text>
      <text x="280" y="226" font-size="12" fill="#6b5c44">3 a 4 semanas</text>
    </g>
    <g>
      <circle cx="390" cy="190" r="9" fill="#A84E1C"/>
      <text x="390" y="162" font-size="13" font-weight="700" fill="#2c2416">Destete</text>
      <text x="390" y="226" font-size="12" fill="#6b5c44">4 a 8 semanas</text>
    </g>
    <g>
      <circle cx="500" cy="190" r="9" fill="#2F5D50"/>
      <text x="500" y="162" font-size="13" font-weight="700" fill="#2c2416">Adopción ideal</text>
      <text x="500" y="226" font-size="12" fill="#6b5c44">10 a 12 semanas</text>
    </g>
    <g>
      <circle cx="610" cy="190" r="9" fill="#A84E1C"/>
      <text x="610" y="162" font-size="13" font-weight="700" fill="#2c2416">Madurez sexual</text>
      <text x="610" y="226" font-size="12" fill="#6b5c44">4 a 7 meses</text>
    </g>
    <g>
      <circle cx="720" cy="190" r="9" fill="#A84E1C"/>
      <text x="720" y="162" font-size="13" font-weight="700" fill="#2c2416">Adulto</text>
      <text x="720" y="226" font-size="12" fill="#6b5c44">desde 12 meses</text>
    </g>
    <g>
      <circle cx="830" cy="190" r="9" fill="#A84E1C"/>
      <text x="830" y="162" font-size="13" font-weight="700" fill="#2c2416">Senior</text>
      <text x="830" y="226" font-size="12" fill="#6b5c44">desde 10 años</text>
    </g>
  </g>
  <text x="450" y="300" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="13" fill="#6b5c44">Gestación: unos 65 días (cerca de 9 semanas), antes del nacimiento.</text>
  <text x="450" y="330" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" fill="#6b5c44">Línea de tiempo orientativa. Las edades varían según la raza y el individuo.</text>
</svg>
